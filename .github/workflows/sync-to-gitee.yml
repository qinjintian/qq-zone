name: Sync To Gitee

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

jobs:
  sync:
    name: Mirror Repository To Gitee
    runs-on: ubuntu-latest
    timeout-minutes: 1440

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add Gitee remote
        run: |
          git remote add gitee https://${{ secrets.GITEE_USERNAME }}:${{ secrets.GITEE_TOKEN }}@${{ secrets.GITEE_REPO }}

      - name: Sync GitHub main to Gitee master
        if: github.ref_type == 'branch'
        run: |
          for i in 1 2 3; do
            if git push --force --progress gitee HEAD:master; then
              exit 0
            fi
            echo "Gitee 分支同步失败（第 ${i} 次），30 秒后重试..."
            sleep 30
          done
          exit 1

      - name: Sync tags to Gitee
        if: github.ref_type == 'tag'
        run: |
          tag="${GITHUB_REF_NAME}"
          if git ls-remote --exit-code --tags gitee "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "Gitee 已存在 tag ${tag}，跳过"
            exit 0
          fi
          echo "推送当前 tag: ${tag}"
          for i in 1 2 3; do
            if git push --progress gitee "refs/tags/${tag}:refs/tags/${tag}"; then
              exit 0
            fi
            echo "推送 ${tag} 失败（第 ${i} 次），30 秒后重试..."
            sleep 30
          done
          exit 1
