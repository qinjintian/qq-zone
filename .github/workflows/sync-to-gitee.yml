name: Sync To Gitee

on:
  workflow_dispatch:
    inputs:
      sync_all_tags:
        description: "全量同步历史 v* tag（Gitee 已存在的跳过）"
        required: false
        type: boolean
        default: false
  push:
    branches:
      - main
    tags:
      - "v*"

jobs:
  sync:
    name: Mirror Repository To Gitee
    runs-on: ubuntu-latest
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.sync_all_tags == 'true' && 180 || 20 }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add Gitee remote
        run: |
          git remote add gitee https://${{ secrets.GITEE_USERNAME }}:${{ secrets.GITEE_TOKEN }}@${{ secrets.GITEE_REPO }}

      - name: Sync GitHub main to Gitee master
        if: github.event_name == 'workflow_dispatch' || github.ref_type == 'branch'
        run: |
          git fetch origin main --prune
          for i in 1 2 3; do
            if git push --force --progress gitee origin/main:master; then
              exit 0
            fi
            echo "Gitee 分支同步失败（第 ${i} 次），30 秒后重试..."
            sleep 30
          done
          exit 1

      - name: Sync current tag to Gitee
        if: github.ref_type == 'tag'
        run: |
          tag="${GITHUB_REF_NAME}"
          if git ls-remote --exit-code --tags gitee "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "Gitee 已存在 tag ${tag}，跳过"
            exit 0
          fi
          echo "推送当前 tag: ${tag}"
          for i in 1 2 3; do
            if git push --progress gitee "refs/tags/${tag}:refs/tags/${tag}"; then
              exit 0
            fi
            echo "推送 ${tag} 失败（第 ${i} 次），30 秒后重试..."
            sleep 30
          done
          exit 1

      - name: Sync all missing tags to Gitee
        if: github.event_name == 'workflow_dispatch' && inputs.sync_all_tags
        run: |
          remote_tags="$(git ls-remote --tags gitee | awk '{print $2}' | sed 's/\^{}$//' | sort -u)"
          pushed=0
          skipped=0
          while IFS= read -r tag; do
            [ -z "${tag}" ] && continue
            if printf '%s\n' "${remote_tags}" | grep -qx "refs/tags/${tag}"; then
              echo "Gitee 已存在 tag ${tag}，跳过"
              skipped=$((skipped + 1))
              continue
            fi
            echo "推送历史 tag: ${tag}"
            ok=0
            for i in 1 2 3; do
              if git push --progress gitee "refs/tags/${tag}:refs/tags/${tag}"; then
                ok=1
                pushed=$((pushed + 1))
                break
              fi
              echo "推送 ${tag} 失败（第 ${i} 次），30 秒后重试..."
              sleep 30
            done
            if [ "${ok}" -ne 1 ]; then
              echo "推送 tag ${tag} 失败"
              exit 1
            fi
          done < <(git tag -l 'v*')
          echo "全量 tag 同步完成：新增 ${pushed} 个，跳过 ${skipped} 个"
